[[repos]]
repo = "builtin"
hooks = [
    { id = "check-json" },
    { id = "check-yaml" },
    { id = "check-toml" },
    # mislabeled.txt must stay byte-identical to report.docx (same bytes
    # under a lying extension, for the format-detection test) — a trailing
    # newline would break that invariant, so it is exempt from this hook.
    { id = "end-of-file-fixer", exclude = "^e2e/fixtures/mislabeled\\.txt$" },
]

[[repos]]
repo = "local"
hooks = [
    { id = "cargo-clippy", name = "cargo clippy", entry = "cargo clippy -- -D warnings", language = "system", pass_filenames = false, always_run = true },
    { id = "cargo-fmt", name = "cargo fmt", entry = "cargo fmt", language = "system", pass_filenames = false, always_run = true },
]
